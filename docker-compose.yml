services:
  db:
    image: postgres:16-alpine
    container_name: lancerboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lancerboard
      POSTGRES_PASSWORD: lancerboard_dev
      POSTGRES_DB: lancerboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: