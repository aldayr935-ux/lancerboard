services:
  db:
    image: postgres:16-alpine
    container_name: lancerboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lancerboard
      POSTGRES_PASSWORD: lancerboard_dev
      POSTGRES_DB: lancerboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lancerboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lancerboard-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lancerboard:lancerboard_dev@db:5432/lancerboard
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: lancerboard-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data: